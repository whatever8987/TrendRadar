app:
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  show_version_update: true # Control version update notifications, if false, no new version prompts

crawler:
  request_interval: 1000 # Request interval (milliseconds)
  enable_crawler: true # Whether to enable news crawling, if false, program stops
  use_proxy: false # Whether to use proxy, false to disable
  default_proxy: "http://127.0.0.1:10086"

# 🔸 daily (Daily Summary Mode)
#   • Push timing: Scheduled pushes (default hourly)
#   • Content: All matched news from the day + new news section
#   • Use case: Daily reports, comprehensive daily trend overview
#
# 🔸 current (Current Ranking Mode)
#   • Push timing: Scheduled pushes (default hourly)
#   • Content: Current ranking matched news + new news section
#   • Use case: Real-time trend tracking, current hottest content
#
# 🔸 incremental (Incremental Monitoring Mode)
#   • Push timing: Only push when new content appears
#   • Content: Newly appearing frequency-matched news
#   • Use case: Avoid duplicate information interference

# Push mode selection
report:
  mode: "daily" # Options: "daily"|"incremental"|"current"
  rank_threshold: 5 # Ranking highlight threshold

notification:
  enable_notification: true # Whether to enable notifications, if false, no mobile notifications
  message_batch_size: 4000 # Message batch size (bytes) (don't change this)
  dingtalk_batch_size: 20000 # DingTalk message batch size (bytes) (don't change this)
  feishu_batch_size: 29000 # Feishu message batch size (bytes)
  batch_send_interval: 3 # Batch send interval (seconds)
  feishu_message_separator: "━━━━━━━━━━━━━━━━━━━" # Feishu message separator

  # 🕐 Push time window control (optional)
  # Purpose: Limit push time range to avoid non-working hour disturbances
  # Use cases:
  #   - Only receive pushes during weekday work hours (e.g., 09:00-18:00)
  #   - Want to receive summaries at fixed evening times (e.g., 20:00-22:00)
  push_window:
    enabled: false  # Whether to enable push time window control, default off
    # Note: GitHub Actions execution time is unstable, recommend at least 2-hour time range
    # For precise scheduled pushes, recommend Docker deployment on personal server
    time_range:
      start: "20:00"  # Push time window start (Beijing time)
      end: "22:00"    # Push time window end (Beijing time)
    once_per_day: true  # Only push once per day within time window, if false, push every execution within window
    push_record_retention_days: 7  # Push record retention days

  # Please securely store webhooks, do not make public
  # If deploying via GitHub fork, do not enter webhooks here, but add to GitHub Secrets
  # Otherwise, may receive strange ads or serious security risks
  webhooks:
    feishu_url: "" # Feishu bot webhook URL
    dingtalk_url: "" # DingTalk bot webhook URL
    wework_url: "" # WeChat Work bot webhook URL
    telegram_bot_token: "" # Telegram Bot Token
    telegram_chat_id: "" # Telegram Chat ID
    email_from: "" # Sender email address
    email_password: "" # Sender email password or authorization code
    email_to: "" # Recipient email address, multiple recipients separated by commas
    email_smtp_server: "" # SMTP server address (optional, auto-detect if empty)
    email_smtp_port: "" # SMTP port (optional, auto-detect if empty)
    ntfy_server_url: "https://ntfy.sh" # ntfy server address, default public service, can use self-hosted
    ntfy_topic: "" # ntfy topic name
    ntfy_token: "" # ntfy access token (optional, for private topics)

# Used to make higher attention news appear earlier, using algorithm to reorganize different platform hot searches with your focus, total should be 1
weight:
  rank_weight: 0.6 # Ranking weight
  frequency_weight: 0.3 # Frequency weight
  hotness_weight: 0.1 # Hotness weight

# name can be any custom name for display only, changing name after days of operation won't affect code
platforms:
  - id: "toutiao"
    name: "Jinri Toutiao"
  - id: "baidu"
    name: "Baidu Hot Search"
  - id: "wallstreetcn-hot"
    name: "Wall Street CN"
  - id: "thepaper"
    name: "The Paper"
  - id: "bilibili-hot-search"
    name: "Bilibili Hot Search"
  - id: "cls-hot"
    name: "Cailianshe Hot"
  - id: "ifeng"
    name: "Ifeng"
  - id: "tieba"
    name: "Tieba"
  - id: "weibo"
    name: "Weibo"
  - id: "douyin"
    name: "Douyin"
  - id: "zhihu"
    name: "Zhihu"
